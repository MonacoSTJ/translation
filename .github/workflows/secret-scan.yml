name: Secret scan

# A credential in a tracked file is published to every clone. The scanner
# knows the shapes this group's credentials take and exits 1 on any finding,
# which fails this run. Findings are either a key to rotate or a documented
# example to add to KNOWN_EXAMPLES with a reason; there is no third option.
on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential shapes
        run: python3 scripts/scan_secrets.py
